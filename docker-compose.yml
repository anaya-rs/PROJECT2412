services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from:
        - backend:latest
    container_name: lesson-creator-backend
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USE_LOCAL_LLM: ${USE_LOCAL_LLM:-false}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - lesson-network
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__
            - "*.pyc"
            - ".pytest_cache"
            - "*.db"
        - action: rebuild
          path: ./backend/requirements.txt
          target: /app/requirements.txt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      cache_from:
        - frontend:latest
    container_name: lesson-creator-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lesson-network
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - __pycache__
            - "*.pyc"
            - ".pytest_cache"
            - "*.db"
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json
          target: /app/package.json

networks:
  lesson-network:
    driver: bridge

volumes: {}
